version: '3.8'

services:
  promptify:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-2.0-flash-exp}
    volumes:
      - ./app.py:/app/app.py
      - ./assets:/app/assets
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
